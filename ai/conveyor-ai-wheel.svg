<svg xmlns="http://www.w3.org/2000/svg" viewBox="-3 -3 30 30" fill="none" role="img" aria-label="ConveyorAI working">
  <style>
    /* The ConveyorAI wheel. The Conveyor mark spins and sparkles, and every
       few seconds a tool it uses (search, folder, document, edit) cross-fades
       in over it and settles, then the mark returns. The whole animation lives
       here so nothing but an &lt;img&gt; ships to the page. */
    .cw-spin,
    .cw-tool,
    .cw-sparkle {
      transform-box: fill-box;
      transform-origin: center;
    }
    .cw-spin {
      fill: #20b08a;
      animation: cw-rotate 1.4s linear infinite, cw-mark 3s ease-in-out infinite;
    }
    .cw-tool {
      fill: #20b08a;
      opacity: 0;
      animation: cw-tool 12s ease-in-out infinite;
    }
    .cw-tool-2 { animation-delay: 3s; }
    .cw-tool-3 { animation-delay: 6s; }
    .cw-tool-4 { animation-delay: 9s; }
    .cw-sparkle {
      fill: #7de5ca;
      opacity: 0;
      animation: cw-sparkle 3s ease-in-out infinite;
    }

    @keyframes cw-rotate {
      to { transform: rotate(360deg); }
    }
    /* The mark holds, spins away under the tool, then returns. */
    @keyframes cw-mark {
      0%, 43% { opacity: 1; }
      50%, 90% { opacity: 0; }
      100% { opacity: 1; }
    }
    /* One tool per beat: rises in, settles, fades before the mark returns. */
    @keyframes cw-tool {
      0%, 12.5% { opacity: 0; transform: translateY(2px); }
      14.5% { opacity: 1; transform: translateY(0); }
      20% { opacity: 1; transform: translateY(-1.5px); }
      22.5% { opacity: 0; transform: translateY(0); }
      100% { opacity: 0; }
    }
    @keyframes cw-sparkle {
      0% { opacity: 0; transform: scale(0.6); }
      12% { opacity: 1; transform: scale(1); }
      30%, 100% { opacity: 0; transform: scale(0.6); }
    }

    /* No motion: the plain mark, standing still. */
    @media (prefers-reduced-motion: reduce) {
      .cw-spin { animation: none; opacity: 1; }
      .cw-tool, .cw-sparkle { animation: none; opacity: 0; }
    }
  </style>

